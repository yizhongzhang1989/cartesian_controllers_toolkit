# =============================================================================
# cartesian_controllers_toolkit -- packaged DEFAULT configuration.
#
# This is the toolkit's own built-in config, shipped INSIDE the submodule
# (cct_common/config/toolkit_defaults.yaml). It centralises the default
# values -- ports, topics, frames, safety limits -- that would otherwise be
# hard-coded in each package's launch file, so there is ONE place to read
# and edit them.
#
# Config resolution order (cct_common.config_manager.ConfigManager picks the
# FIRST source that exists):
#   1. A user-specified file: the ROBOT_CONFIG_PATH environment variable.
#   2. The consuming workspace's config/robot_config.yaml (or, failing that,
#      config/robot_config.example.yaml).
#   3. THIS file -- the toolkit's packaged default.
# If even this file cannot be read (e.g. cct_common is not built yet), each
# launch file falls back to the hard-coded `_FALLBACKS` dict it carries as a
# last resort.
#
# To customise for YOUR robot, do NOT edit this file. Instead either:
#   * copy the sections you need into <workspace>/config/robot_config.yaml
#     (wins via step 2), or
#   * point ROBOT_CONFIG_PATH at your own file (wins via step 1).
#
# Top-level keys are package names; second-level keys map 1-to-1 to each
# package launch file's arguments (so `key: value` here == `key:=value` on
# the `ros2 launch` command line).
# =============================================================================
version: 1

# -----------------------------------------------------------------------------
# cartesian_control_manager -- FZI orchestrator (engage UX + safety supervisor)
# -----------------------------------------------------------------------------
cartesian_control_manager:
  # multi-instance identity ("" = single-instance; e.g. "left" / "right" for
  # dual-arm setups -- namespaces the node + suffixes the spawned controllers)
  instance_name: ""
  # connectivity
  wrench_topic: "/ft_sensor/wrench_compensated"
  joint_states_topic: "/joint_states"
  controller_manager_ns: "/controller_manager"
  engaged_default: false
  # FZI controller wiring
  active_controller_name: "cartesian_force_controller"
  fzi_jtc_controller_name: "joint_trajectory_controller"
  fzi_target_frame: "tool0"
  fzi_target_rate_hz: 10.0
  fzi_service_timeout_sec: 2.0
  # FZI preset YAML location (resolved via ament_index at launch time).
  # Robot-specific: you MUST override this per robot. The packaged default
  # points at the toolkit's OWN robot-neutral example preset (shipped by
  # cartesian_control_manager) so a fresh checkout resolves cleanly; copy
  # that file into your bringup package and edit its joints/frames.
  fzi_controller_yaml_package: "cartesian_control_manager"
  fzi_controller_yaml_relpath: "config/fzi_preset.example.yaml"
  # target_wrench heartbeat setpoint (all-zero == pure free-drive)
  target_wrench_force_x: 0.0
  target_wrench_force_y: 0.0
  target_wrench_force_z: 0.0
  target_wrench_torque_x: 0.0
  target_wrench_torque_y: 0.0
  target_wrench_torque_z: 0.0
  # Frame the published target_wrench is stamped with (header.frame_id).
  # "" -> fall back to fzi_target_frame. Selectable live from the dashboard.
  target_wrench_frame: ""
  # external high-rate target_wrench input ("" = disabled)
  external_target_wrench_topic: ""
  external_target_wrench_timeout_sec: 0.2
  # master enable for the target_wrench output (false = leave the topics
  # silent so an external publisher can own them; toggle live from the UI)
  publish_target_wrench: false
  # supervisor + state publish
  loop_rate_hz: 50.0
  state_publish_rate_hz: 5.0
  # safety
  max_wrench_force: 80.0
  max_wrench_torque: 10.0
  engage_max_joint_velocity: 0.05
  ft_stale_after: 0.25
  joint_states_stale_after: 0.25

# -----------------------------------------------------------------------------
# ft_sensor_gravity_compensation -- compensated wrench publisher + calibration UI
# -----------------------------------------------------------------------------
ft_sensor_gravity_compensation:
  input_topic: "/ft_sensor/wrench_raw"
  output_topic: "/ft_sensor/wrench_compensated"
  world_frame: "base_link"        # gravity-fixed frame in /tf
  sensor_frame: "tool0"           # frame whose orientation drives the gravity vector
  reliability: "best_effort"      # match the publisher's QoS
  publish_when_no_tf: false       # if true, fall back to bias-only when TF is stale
  storage_path: "~/.ros/ft_sensor_gravity_compensation/end_effectors.yaml"
  host: "0.0.0.0"
  dashboard_port: 0               # 0 = web dashboard disabled; set a port (e.g. 8100) to enable
  gravity: 9.80665                # m/s^2
  tf_timeout: 0.05                # seconds, per lookup_transform call
  tf_max_age: 1.0                 # seconds; older TF -> stop publishing

# -----------------------------------------------------------------------------
# cartesian_controller_dashboard -- web UI for monitoring + gain tuning
# -----------------------------------------------------------------------------
cartesian_controller_dashboard:
  orchestrator_ns: "/cartesian_control_manager"
  controller_name: "cartesian_force_controller"
  wrench_topic: "/ft_sensor/wrench_compensated"
  joint_states_topic: "/joint_states"
  base_frame: "base_link"         # TCP pose display: base_frame -> tool_frame via TF
  tool_frame: "tool0"             # ROS-Industrial flange convention; override per robot
  service_timeout_sec: 2.0
  host: "0.0.0.0"
  port: 8120

# -----------------------------------------------------------------------------
# ft_sensor_dashboard -- sensor-agnostic wrench plotting UI
# -----------------------------------------------------------------------------
ft_sensor_dashboard:
  topic: "/ft_sensor/wrench_raw"
  host: "0.0.0.0"
  port: 8080
  window_seconds: 10.0
  push_rate: 30.0                 # SSE updates per second
  reliability: "best_effort"
  title: ""

# -----------------------------------------------------------------------------
# robot_feasibility_test -- headless engine (+ optional dashboard) that scores
# a forward-position-controller's force-control readiness
# -----------------------------------------------------------------------------
robot_feasibility_test:
  # engine connectivity
  joint_states_topic: "/joint_states"
  wrench_topic: ""                # "" = no wrench scoring; set your FT topic
  controller_manager: "/controller_manager"
  controller_name: ""             # "" = auto/operator-selected at runtime
  send_rate: 200.0                # Hz command stream
  default_limit_deg: 8.0          # per-joint test excursion cap
  report_dir: "~/.ros/robot_feasibility_test/runs"
  status_rate: 10.0
  # dashboard (engine launch passes dashboard_port through; dashboard launch
  # serves the UI). Robot-neutral.
  host: "0.0.0.0"
  dashboard_port: 8140
  engine_node: "feasibility_test_engine"

# -----------------------------------------------------------------------------
# aux_frame_manager -- single-writer of the canonical augmented URDF.
# Appends fixed-joint "aux" frames to the manufacturer URDF and serves the
# result on a latched topic for the FZI cartesian controllers, mirroring it to
# robot_state_publisher for TF. Two launch files share this section:
#   * aux_frame_manager.launch.py      -- manager (+ optional dashboard)
#   * cartesian_urdf_source.launch.py  -- manager + pre-activate guard (+ dashboard)
# FRAMES: this packaged fallback intentionally defines NO aux_frames -- it is
# robot-neutral. Put your robot's frames under `aux_frame_manager.aux_frames`
# (a list) in your robot_config.yaml; the node reads its OWN section by default,
# so launching it appends those frames. Booleans are quoted because these
# values become launch-argument strings.
# -----------------------------------------------------------------------------
aux_frame_manager:
  base_urdf_topic: "/robot_description"            # manufacturer URDF in
  output_topic: "/cartesian/robot_description"     # canonical augmented URDF out
  update_robot_state_publisher: "true"             # mirror canonical URDF to rsp (TF)
  robot_state_publisher_name: "robot_state_publisher"
  config_file: ""           # force a specific yaml ("" = auto-resolve via cct_common)
  # root TF frame: cartesian_urdf_source exposes it as `robot_base_link`,
  # aux_frame_manager as `base_frame` (both default to base_link).
  robot_base_link: "base_link"
  base_frame: "base_link"
  dashboard_port: ""        # optional web dashboard: "" = off, else a port (e.g. 8160)

# -----------------------------------------------------------------------------
# robot_control_test -- interactive web bench (3D canvas) to verify a robot
# works with each of its ros2_control controllers. Discovers the controllers on
# the controller_manager, activates one, and sends safe speed-limited test
# commands: joint-trajectory / forward-position joint jogs, and the FZI
# cartesian motion / compliance / force targets. Robot-neutral.
# -----------------------------------------------------------------------------
robot_control_test:
  dashboard_port: 8200                            # web UI port
  controller_manager: "/controller_manager"       # discover / switch controllers
  robot_description_topic: "/robot_description"    # URDF source for the 3D model
  joint_states_topic: "/joint_states"              # live joint feedback
  base_frame: "base_link"        # TF frame the 3D view / Cartesian targets use
  tip_frame: ""                  # TCP frame ("" -> the URDF's last leaf link)
  max_joint_speed: 0.5           # rad/s cap for JTC moves + forward-position ramps
  send_rate: 100.0               # Hz forward-position command stream rate
